name: Fetch Repo (traer repositorio de GitHub)

# Descarga un repositorio de GitHub directo al runner y lo copia en este repo (sin subir ZIPs a mano).
# Lanzar a mano: Actions > Fetch Repo > Run workflow.
# - repo:             dueño/nombre del repositorio de origen (ej. 26bhuvan/vivi-music)
# - ref:              rama, tag o commit (vacío = rama por defecto)
# - destino:          "." = raíz de este repo, o una carpeta (ej. _original) para dejarlo aparte
# - borrar_sobrantes: si es true, en el destino borra lo que NO venga en el origen (espejo exacto)
# - compilar:         si es true, lanza el workflow Release al terminar
# Nunca toca: .git, .github (GitHub no deja a un robot cambiarlo), Drop-Files, claude.md, grok.md, ambos.md,
#             llaves de firma (*.keystore, *.jks) ni ZIPs de la raíz.
# Repos privados: crea el secret SOURCE_REPO_TOKEN (token con permiso de lectura). Los públicos no lo necesitan.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repositorio de origen (dueño/nombre)'
        required: true
        type: string
      ref:
        description: 'Rama, tag o commit (vacío = por defecto)'
        required: false
        default: ''
        type: string
      destino:
        description: 'Carpeta destino en este repo ("." = raíz)'
        required: true
        default: '.'
        type: string
      borrar_sobrantes:
        description: 'Borrar del destino lo que no venga en el origen'
        required: true
        default: false
        type: boolean
      compilar:
        description: 'Lanzar Release al terminar'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-repo
  cancel-in-progress: false

jobs:
  traer:
    name: Fetch repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Traer y copiar
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          DESTINO: ${{ inputs.destino }}
          BORRAR: ${{ inputs.borrar_sobrantes }}
          RAMA: ${{ github.ref_name }}
          TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
        run: |
          set -eu

          # Validaciones (los inputs van por variables de entorno, nunca dentro del script)
          if ! printf '%s' "$REPO" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::repo debe tener la forma dueño/nombre"; exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]*$'; then
            echo "::error::ref contiene caracteres no permitidos"; exit 1
          fi
          case "$DESTINO" in
            /*|*..*|.git|.git/*|.github|.github/*|Drop-Files|Drop-Files/*)
              echo "::error::destino no permitido: $DESTINO"; exit 1;;
          esac
          [ -n "$DESTINO" ] || DESTINO="."

          # Descargar tarball (sin ref = rama por defecto)
          URL="https://api.github.com/repos/$REPO/tarball"
          [ -n "$REF" ] && URL="$URL/$REF"
          rm -rf /tmp/src /tmp/src.tgz && mkdir /tmp/src
          if ! curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
               -o /tmp/src.tgz "$URL"; then
            echo "::error::No se pudo descargar $REPO (${REF:-rama por defecto}). Revisa el nombre, la rama o, si es privado, el secret SOURCE_REPO_TOKEN."
            exit 1
          fi
          tar -xzf /tmp/src.tgz -C /tmp/src --strip-components=1
          rm -rf /tmp/src/.git /tmp/src/.github
          find /tmp/src -name '.DS_Store' -delete

          # Copiar con rsync protegiendo lo propio de este repo
          mkdir -p "$DESTINO"
          OPTS=(-a --exclude='/.git' --exclude='/.github' --exclude='/Drop-Files'
                --exclude='/claude.md' --exclude='/grok.md' --exclude='/ambos.md'
                --exclude='*.keystore' --exclude='*.jks' --exclude='/*.zip')
          [ "$BORRAR" = "true" ] && OPTS+=(--delete)
          rsync "${OPTS[@]}" /tmp/src/ "$DESTINO/"
          [ -f gradlew ] && chmod +x gradlew || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "- El origen no traía cambios respecto a este repo." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "chore: traer $REPO (${REF:-default}) a $DESTINO"
            git push origin "HEAD:refs/heads/$RAMA"
            {
              echo "## Fetch Repo"
              echo "- Origen: \`$REPO\` (${REF:-rama por defecto})"
              echo "- Destino: \`$DESTINO\` | borrar sobrantes: $BORRAR"
              echo "- Archivos cambiados: $(git show --stat --oneline HEAD | tail -n 1)"
              echo "- \`.github\` no se toca: súbelo a mano si lo necesitas."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lanzar Release
        if: ${{ inputs.compilar }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RAMA: ${{ github.ref_name }}
        run: gh workflow run release.yml --ref "$RAMA"
